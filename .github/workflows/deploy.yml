name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom pulls in undici, which needs a modern webidl.util
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the music parser
        run: npm test

      - name: Test the DolDoc reader
        run: npm run test:doldoc

      - name: Build
        run: npm run build

      - name: Smoke test the built bundle
        run: npm run test:smoke

      - name: Smoke test the source explorer
        run: npm run test:explorer

      - name: Smoke test the tribute pages
        run: npm run test:pages

      - name: Test the global search
        run: npm run test:search

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
